{# O botão de cada documento: põe na seleção ou tira dela. Troca a si mesmo pela resposta. #}
<button type="button" id="sel-{{ uid | id_seguro }}" class="btn btn-sel{% if marcado %} marcado{% endif %}"
        {% if botao_fora %}hx-swap-oob="outerHTML"{% endif %}
        hx-post="{{ url_for('remover_selecao' if marcado else 'adicionar_selecao', doc_uid=uid) }}"
        hx-swap="outerHTML" hx-target="this" hx-select="unset" hx-push-url="false" hx-indicator="this" aria-pressed="{{ 'true' if marcado else 'false' }}"
        title="{% if marcado %}{{ tr('Tirar este documento da seleção', 'Remove this document from the selection') }}{% else %}{{ tr('Guardar este documento na seleção, para a lista que você leva ao arquivo', 'Keep this document in the selection, for the list you take to the archive') }}{% endif %}">
    {%- if marcado -%}
    <span class="sel-sim">✓ {{ tr("Na seleção", "Selected") }}</span><span class="sel-tirar">✕ {{ tr("Tirar da seleção", "Remove") }}</span>
    {%- else -%}
    <span class="capitulo">⸿</span> {{ tr("Pôr na seleção", "Add to selection") }}
    {%- endif -%}
</button>
